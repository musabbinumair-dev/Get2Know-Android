name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      CI: "true"
      CAPACITOR_TELEMETRY: "false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --no-audit

      - name: Build Web App & Sync to Android
        run: |
          npm run build
          npx cap sync android --no-color

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          cache-read-only: false

      - name: Assemble Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f "./gradlew" ] && [ -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Building using Gradle wrapper..."
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "Building using system Gradle..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate and Stage Generated APK
        run: |
          echo "Scanning for compiled APK..."
          find android/app/build/outputs/apk -name "*.apk"
          mkdir -p build-output
          cp $(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1) build-output/app-debug.apk
          ls -lh build-output/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Get-to-Know-You-Debug-APK
          path: build-output/app-debug.apk
          if-no-files-found: error
